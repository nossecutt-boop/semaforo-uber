name: Compilar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q SemaforoUber.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug
        working-directory: SemaforoUber
      - uses: actions/upload-artifact@v4
        with:
          name: semaforo-uber-apk
          path: SemaforoUber/app/build/outputs/apk/debug/*.apk
